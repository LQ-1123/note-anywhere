<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https: http:" />
  <title>NoteAnywhere</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <aside id="side">
      <div id="side-head">
        <span id="side-title">文档</span>
        <button id="new-btn" title="新建一页（Alt+N）">＋</button>
      </div>
      <div id="page-list"></div>
      <div id="tag-box" hidden>
        <div id="tag-head">标签</div>
        <div id="tag-list"></div>
      </div>
      <div id="side-foot">
        <button id="settings-btn" title="设置">⚙</button>
      </div>
    </aside>
    <header id="bar">
      <div id="title">新的一页</div>
      <div id="search-box">
        <span id="search-box-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="12" height="12" focusable="false">
            <circle cx="6.8" cy="6.8" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M10.2 10.2 13.8 13.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        <input id="search-input" type="text" placeholder="搜索笔记" autocomplete="off" spellcheck="false" />
      </div>
    </header>

    <!-- 每日回顾：呼出时顶部浮一条旧笔记，可直接往下写不受影响 -->
    <div id="review" hidden>
      <div id="review-head">
        <span id="review-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="11" height="11" focusable="false">
            <circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M8 4.6V8l2.3 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span id="review-label"></span>
        <span id="review-date"></span>
        <span id="review-actions">
          <button id="review-open" class="review-btn">打开原页</button>
          <button id="review-next" class="review-btn">换一条</button>
          <button id="review-close" class="review-btn" title="收起">✕</button>
        </span>
      </div>
      <div id="review-text"></div>
    </div>

    <div id="editor"></div>
    <footer id="hint">
      <span>Alt+Q / Esc 收起并保存 · Alt+N 新建 · Alt+Del 删除本页</span>
      <span id="saved-at"></span>
    </footer>
  </div>

  <!-- 设置面板 -->
  <div id="settings-mask" hidden>
    <div id="settings-panel">
      <div id="settings-head">
        <span>设置</span>
        <button id="settings-close" title="关闭">✕</button>
      </div>
      <div id="settings-body">
        <section>
          <h3>通用</h3>
          <div class="set-row">
            <span class="set-label">呼出热键</span>
            <button id="set-hotkey" class="set-btn" title="点击后按下新的组合键"></button>
          </div>
          <div class="set-row">
            <span class="set-label">主题</span>
            <div class="seg" id="set-theme">
              <button data-v="system">跟随系统</button>
              <button data-v="dark">深色</button>
              <button data-v="light">浅色</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label">开机自启</span>
            <label class="switch"><input type="checkbox" id="set-autostart" /><span></span></label>
          </div>
          <div class="set-row">
            <span class="set-label">每日回顾</span>
            <div class="seg" id="set-reviewmode">
              <button data-v="off">关闭</button>
              <button data-v="daily">每天第一次</button>
              <button data-v="always">每次呼出</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label">回顾门槛</span>
            <div class="seg compact" id="set-reviewdays">
              <button data-v="1">1 天</button>
              <button data-v="3">3 天</button>
              <button data-v="7">7 天</button>
              <button data-v="14">14 天</button>
              <button data-v="30">30 天</button>
            </div>
          </div>
          <div class="set-row col">
            <span class="set-label">笔记保存目录</span>
            <div class="set-dir-row">
              <span id="set-notesdir" class="set-path"></span>
              <button id="set-notesdir-change" class="set-btn">更改</button>
              <button id="set-notesdir-open" class="set-btn">打开</button>
            </div>
          </div>
        </section>

        <section>
          <h3>编辑器</h3>
          <div class="set-row">
            <span class="set-label">正文字号</span>
            <div class="stepper">
              <button id="set-font-minus">−</button>
              <span id="set-font-size">15</span>
              <button id="set-font-plus">＋</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label">Tab 宽度</span>
            <div class="seg" id="set-tabwidth">
              <button data-v="2">2 空格</button>
              <button data-v="4">4 空格</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label">Markdown 实时渲染</span>
            <label class="switch"><input type="checkbox" id="set-livepreview" /><span></span></label>
          </div>
          <div class="set-row">
            <span class="set-label">代码块行号</span>
            <label class="switch"><input type="checkbox" id="set-linenumbers" /><span></span></label>
          </div>
          <div class="set-row">
            <span class="set-label">缩进圆点</span>
            <label class="switch"><input type="checkbox" id="set-indentdots" /><span></span></label>
          </div>
        </section>

        <section>
          <h3>窗口与数据</h3>
          <div class="set-row">
            <span class="set-label">窗口置顶</span>
            <label class="switch"><input type="checkbox" id="set-alwaysontop" /><span></span></label>
          </div>
          <div class="set-row">
            <span class="set-label">窗口位置</span>
            <button id="set-reset-window" class="set-btn">重置（下次呼出居中）</button>
          </div>
          <div class="set-row col">
            <span class="set-label">关于</span>
            <div class="set-dir-row">
              <span class="set-path" id="set-version"></span>
              <button id="set-open-notes" class="set-btn">笔记目录</button>
              <button id="set-open-userdata" class="set-btn">数据目录</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- 搜索 / 标签结果：从右上角搜索框下方展开 -->
  <div id="search-mask" hidden>
    <div id="search-panel">
      <div id="search-list"></div>
      <div id="search-foot">
        <span><b>↑</b> <b>↓</b> 选择 · <b>Enter</b> 打开 · <b>Esc</b> 关闭</span>
        <span id="search-meta"><span id="search-scope"></span><span id="search-count"></span></span>
      </div>
    </div>
  </div>

  <!-- Tauri 版桥接垫片：Electron 下 preload 已注入 window.bridge，本文件会自动跳过 -->
  <script src="bridge-tauri.js"></script>
  <script src="app.bundle.js"></script>
</body>
</html>
